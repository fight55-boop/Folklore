<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民俗恐怖故事网站 - 登录</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="登录容器">

        <div class="选项卡容器">
            <div class="选项卡 激活" id="登录选项卡">登录</div>
            <div class="选项卡" id="注册选项卡">注册</div>
        </div>

        <div class="表单容器">
            <form id="登录表单" action="login.php" method="post">
                <div class="表单组">
                    <label for="用户名">用户名</label>
                    <input type="text" id="用户名" name="用户名" placeholder="请输入用户名" required>
                </div>

                <div class="表单组">
                    <label for="密码">密码</label>
                    <input type="password" id="密码" name="密码" placeholder="请输入密码" required>
                </div>


                <div class="选项">
                    <div class="记住我">
                        <input type="checkbox" id="记住" name="记住">
                        <label for="记住">记住用户名</label>
                    </div>
                    <a href="#" class="忘记密码">忘记密码?</a>
                </div>

                <button type="submit" class="登录按钮">立即登录</button>
            </form>

            <form id="注册表单" action="register.php" method="post" style="display: none;">
                <div class="表单组">
                    <label for="注册用户名">用户名</label>
                    <input type="text" id="注册用户名" name="注册用户名" placeholder="请输入用户名" required>
                </div>

                <div class="表单组">
                    <label for="注册密码">密码</label>
                    <input type="password" id="注册密码" name="注册密码" placeholder="请输入密码" required>
                </div>

                <div id="pw-rules" class="rules" aria-live="polite">
                    <div class="rule" id="r-length">• 长度 8~20,可包含字母、数字和特殊字符</div>
                </div>

                <div class="表单组">
                    <label for="确认密码">确认密码</label>
                    <input type="password" id="确认密码" name="确认密码" placeholder="请再次输入密码" required>
                </div>

                <button type="submit" class="注册按钮">立即注册</button>

            </form>

        </div>

    </div>



    <script src="js/login.js"></script>
</body>

</html>
