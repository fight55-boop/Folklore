<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南堰村·循环账 - 官网首页</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="preload" as="image" href="images/back1.jpg">


</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">铁头王国</div>
        <ul class="nav-menu">
            <li><a href="#" class="active">官网首页</a></li>
            <li><a href="#">游戏中心</a></li>
            <li><a href="#">新闻中心</a></li>
            <li><a href="intro.html" class="highlight">游戏介绍</a></li>
        </ul>
        <button class="login-btn">登录/注册</button>
    </nav>

    <!-- 主内容区域 -->
    <div class="main-container">
        <!-- 左侧内容 -->
        <div class="left-content">
            <div>
                <h1 class="game-title">南堰村·循环账</h1>
                <p class="game-subtitle">探索神秘村庄，解开时间循环之谜</p>
            </div>

            <div class="game-scene">
                <div class="scene-placeholder">
                    <img src="images/index_per.png" alt="游戏场景预览">
                </div>
            </div>

            <div class="action-buttons">
                <div class="action-btn">账户充值</div>
                <div class="action-btn">加入我们</div>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="right-content">
            <div class="update-section">
                <h2 class="section-title">南堰村：版本更新</h2>
                <ul class="update-list">
                    <li class="update-item">
                        <div class="update-date">鬼门开：光绪二十三年十月初五</div>
                        <div class="update-content">重大节日活动开启</div>
                    </li>
                    <li class="update-item">
                        <div class="update-date">2025-10-15</div>
                        <div class="update-content">新人物加入探险</div>
                    </li>
                    <li class="update-item">
                        <div class="update-date">2025-10-16</div>
                        <div class="update-content">优化系统并增加新事件</div>
                    </li>
                    <li class="update-item">
                        <div class="update-date">2025-10-17</div>
                        <div class="update-content">修复鬼打墙系统bug</div>
                    </li>
                    <li class="update-item">
                        <div class="update-date">2025-10-19</div>
                        <div class="update-content">查看更多更新内容</div>
                    </li>
                </ul>
                <a href="#" class="view-more">查看更多</a>
            </div>

            <div class="other-games">
                <h2 class="section-title">其他游戏</h2>
                <div class="game-card">
                    <div class="game-icon">豆</div>
                    <div class="game-info">
                        <h3>王者荣耀</h3>
                        <p>竞技游戏</p>
                    </div>
                </div>
                <div class="game-card">
                    <div class="game-icon">巨</div>
                    <div class="game-info">
                        <h3>奇迹暖暖</h3>
                        <p>休闲游戏</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <p>© 2025 铁头王国游戏公司 版权所有</p>
    </footer>

    <script src="js/index.js"></script>

</html>
