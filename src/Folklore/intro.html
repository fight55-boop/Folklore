<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民俗恐怖剧情游戏 - 游戏介绍</title>
    <link rel="stylesheet" href="css/intro.css">
</head>

<body>
    <header>
        <h1>《南堰村》</h1>
        <p>一款交互式民俗恐怖剧情游戏</p>
    </header>

    <section class="intro-section">
        <h2>故事简介</h2>
        <p>
            在一个被遗忘的山村中，古老的祭祀仪式每隔十年重现。你将扮演一位无意闯入村庄的外来者，
            随着线索逐渐揭开，你发现村民隐藏的秘密与自己纠缠在一起。
            每一次选择，都可能改变你的命运......
        </p>

        <p class="text1"><strong><em>在这个充满未知与恐惧的世界里，</em>你准备好了吗？</strong></p>

        <img src="images/intro.webp" alt="游戏预览图" class="screenshot">

        <h2>游戏玩法</h2>
        <ul class="feature-list">
            <li>多分支剧情，每个决定都会影响结局</li>
            <li>玩家根据对剧情的分析进行选择</li>
            <li>每一个选择都可能影响你的命运</li>
            <li>逻辑推理与线索收集玩法结合</li>
        </ul>

        <button class="btn" id="startGame">开始游戏</button>
        <button class="btn" id="return">返回首页</button>
    </section>

    <footer>
        © 2025  铁头王国 | 游戏制作中
    </footer>

    <script src="js/intro.js"></script>
</body>

</html>
